<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Figure 5 V4 rule ablation">
<style>
text{font-family:"Times New Roman",Times,serif;fill:#222}
.title{font-size:25px;font-weight:700}
.panelTitle{font-size:17px;font-weight:700}
.body{font-size:14px}
.small{font-size:12px;fill:#555}
.bold{font-weight:700}
.box{stroke:#222;stroke-width:1.4;rx:12;ry:12}
.panel{fill:#fafafa;stroke:#222;stroke-width:1.4;rx:16;ry:16}
.arrow{stroke:#333;stroke-width:2;fill:none;marker-end:url(#arrow)}
.axis{stroke:#333;stroke-width:1.2}
.grid{stroke:#e5e7eb;stroke-width:1}
</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#333"/></marker></defs>
<rect width="1400" height="900" fill="white"/>
<text x="700" y="42" text-anchor="middle" class="title">Scientific decision quality depends on both rule content and rule order</text>

<rect x="35" y="80" width="650" height="360" class="panel"/>
<rect x="715" y="80" width="650" height="360" class="panel"/>
<rect x="35" y="470" width="650" height="360" class="panel"/>
<rect x="715" y="470" width="650" height="360" class="panel"/>

<text x="60" y="112" class="panelTitle">A  Evidence-supported intervention family</text>
<text x="740" y="112" class="panelTitle">B  Hypothesis discrimination</text>
<text x="60" y="502" class="panelTitle">C  Failure-mode measurement selection</text>
<text x="740" y="502" class="panelTitle">D  Critique detects but does not override bad order</text>

<!-- panel A axes -->
<line x1="120" y1="375" x2="620" y2="375" class="axis"/><line x1="120" y1="150" x2="120" y2="375" class="axis"/>
