<line x1="120" y1="765" x2="620" y2="765" class="axis"/><line x1="120" y1="540" x2="120" y2="765" class="axis"/>
<line x1="120" y1="709" x2="620" y2="709" class="grid"/><line x1="120" y1="653" x2="620" y2="653" class="grid"/><line x1="120" y1="597" x2="620" y2="597" class="grid"/><line x1="120" y1="541" x2="620" y2="541" class="grid"/>
<text x="106" y="770" text-anchor="end" class="small">0%</text><text x="106" y="714" text-anchor="end" class="small">25%</text><text x="106" y="658" text-anchor="end" class="small">50%</text><text x="106" y="602" text-anchor="end" class="small">75%</text><text x="106" y="546" text-anchor="end" class="small">100%</text>
