[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pur-new-workflow"
version = "0.3.0"
description = "Deterministic, statistical and Agent-runtime support for uncertainty-aware PUR formulation workflow"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
  "numpy>=2.0",
  "openai>=1.0",
  "openpyxl>=3.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "statsmodels>=0.14",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
