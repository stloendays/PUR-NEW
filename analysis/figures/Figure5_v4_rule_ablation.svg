<line x1="520" y1="676" x2="520" y2="565" stroke="#777" stroke-width="3"/><circle cx="520" cy="608" r="9" fill="#C46A3A" stroke="#222" stroke-width="1.5"/>
<text x="220" y="570" text-anchor="middle" class="body bold">10/10</text><text x="370" y="570" text-anchor="middle" class="body bold">5/5</text><text x="520" y="596" text-anchor="middle" class="body bold">7/10</text>
<text x="220" y="795" text-anchor="middle" class="small">Full V4</text><text x="370" y="795" text-anchor="middle" class="small">VOI withheld</text><text x="520" y="795" text-anchor="middle" class="small">Order inverted</text>
<text x="365" y="525" text-anchor="middle" class="small">Matched-window 120 °C hold</text>

<!-- Panel D -->
<line x1="800" y1="765" x2="1305" y2="765" class="axis"/><line x1="800" y1="540" x2="800" y2="765" class="axis"/>
<rect x="850" y="541" width="90" height="224" fill="#C46A3A"/><rect x="1010" y="653" width="90" height="112" fill="#d7d7d7"/><rect x="1170" y="541" width="90" height="224" fill="#C46A3A"/>
<text x="895" y="530" text-anchor="middle" class="body bold">10/10</text><text x="1055" y="642" text-anchor="middle" class="body bold">5/10</text><text x="1215" y="530" text-anchor="middle" class="body bold">10/10</text>
<text x="895" y="795" text-anchor="middle" class="small">Skeptic high-severity</text><text x="1055" y="795" text-anchor="middle" class="small">Robustness: change</text><text x="1215" y="795" text-anchor="middle" class="small">Committed anyway</text>
<text x="1045" y="824" text-anchor="middle" class="small">Order-inverted arm: all 10 frozen selections had zero hypothesis discrimination</text>

<text x="700" y="874" text-anchor="middle" class="body bold">Withholding the score damages composition choice; inverting rule order damages both composition and measurement choice, and critique alone does not recover the decision.</text>
</svg>