name: realization-aware-agent-ablation

on:
  push:
    branches:
      - realization-aware-agent-ablation
    paths:
      - "configs/realization_evidence_ablation_v1.json"
      - "scripts/run_realization_evidence_ablation.py"
      - "scripts/summarize_realization_evidence_ablation.py"
      - ".github/workflows/realization-aware-agent-ablation.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realization-aware-agent-ablation
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: gpt-5.6-luna
      SERIES_DIR: results/realization_evidence_ablation/diagnostic_n5

    steps:
      - uses: actions/checkout@v4
        with:
          ref: realization-aware-agent-ablation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate runner and evidence parity
        run: |
          python -m py_compile scripts/run_realization_evidence_ablation.py
          python -m py_compile scripts/summarize_realization_evidence_ablation.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/run_realization_evidence_ablation.py")
          spec = importlib.util.spec_from_file_location("raei", path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          rows = mod.audited_e2_rows()
          nominal = mod.nominal_only_evidence(rows)
          aware = mod.realization_aware_evidence(rows, nominal)

          assert len(rows) == 24, f"expected 24 audited E2 observations, got {len(rows)}"
          assert len({r["realization_id"] for r in rows}) == 4
          assert [x["temperature_c"] for x in nominal["temperature_summaries"]] == [80.0, 90.0, 100.0, 110.0, 120.0, 130.0]
          assert aware["same_nominal_summary"] == nominal
          bridge = aware["same_formulation_e2_anchor_validation"]
          assert abs(bridge["formulation_only_multiplicative_rmse"] - 1.8244156992081213) < 1e-12
          assert abs(bridge["one_anchor_multiplicative_rmse"] - 1.086317254261679) < 1e-12
          assert abs(bridge["log_rmse_reduction_fraction"] - 0.8623002671298862) < 1e-12
          print("RAEI evidence validation passed")
          PY

      - name: Require API key
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "OPENAI_API_KEY secret is not configured." >&2
            exit 1
          fi

      - name: Run preregistered RAEI diagnostic
        run: |
          rm -rf "${SERIES_DIR}"
          python scripts/run_realization_evidence_ablation.py             --output-dir "${SERIES_DIR}"             --n-per-arm 5             --model "${OPENAI_MODEL}"

      - name: Summarize
        if: always()
        run: |
          if [ -f "${SERIES_DIR}/series_manifest.json" ]; then
            python scripts/summarize_realization_evidence_ablation.py               --series-dir "${SERIES_DIR}"               --output derived/realization_evidence_ablation_summary.json               --report "${SERIES_DIR}/RAEI_REPORT.md"
            cat derived/realization_evidence_ablation_summary.json
          fi

      - name: Commit frozen diagnostic records
        if: always()
        run: |
          if [ ! -f "${SERIES_DIR}/series_manifest.json" ]; then
            echo "No series manifest exists; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${SERIES_DIR}" derived/realization_evidence_ablation_summary.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Freeze RAEI diagnostic N=5 per arm"
          git push origin HEAD:realization-aware-agent-ablation
