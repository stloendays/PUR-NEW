name: workflow-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run unit tests
        run: pytest
      - name: Validate committed configuration JSON
        run: |
          python -m json.tool configs/formulation_priors.json > /dev/null
          python -m json.tool configs/blind_benchmark_v2.json > /dev/null
          python -m json.tool configs/agent_v3.json > /dev/null
          python -m json.tool configs/evidence_access_profiles.json > /dev/null
          python -m json.tool configs/action_catalog.json > /dev/null
          python -m json.tool configs/agent_v5_comparison_protocol.json > /dev/null
          python -m json.tool configs/archive/agent_v5_comparison_protocol_v1_0.json > /dev/null
          python -m json.tool schemas/candidate_set.schema.json > /dev/null
      - name: Compile Agent and benchmark runners
        run: |
          python -m py_compile scripts/run_agent_recommendation.py
          python -m py_compile scripts/run_scientific_agent_v3.py
          python -m py_compile scripts/run_hierarchical_agent.py
          python -m py_compile scripts/run_deterministic_baseline.py
          python -m py_compile scripts/build_naive_baseline_view.py
          python -m py_compile scripts/build_candidate_set.py
          python -m py_compile scripts/build_refinement_set.py
          python -m py_compile scripts/run_naive_llm_baseline.py
          python -m py_compile scripts/summarize_agent_benchmark.py
          python -m py_compile scripts/analysis_audit_v1.py
          python -m py_compile scripts/check_manuscript_citations.py
      - name: Build deterministic evidence state
        run: python scripts/build_evidence_state.py --output /tmp/evidence_state.json
      - name: Sanity-check generated evidence JSON
        run: python -m json.tool /tmp/evidence_state.json > /dev/null
      - name: Verify blind evidence firewall removes follow-up outcome and identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from pur_new.evidence_firewall import assert_blind_payload_clean, filter_evidence_state

          state = json.loads(Path('/tmp/evidence_state.json').read_text())
          profiles = json.loads(Path('configs/evidence_access_profiles.json').read_text())['profiles']
          filtered = filter_evidence_state(
              state,
              policy=profiles['blind_pre_result'],
              blinded_formulation_ids={'F1'},
          )
          assert_blind_payload_clean(filtered, blinded_formulation_ids={'F1'})
          Path('/tmp/evidence_state_blind.json').write_text(json.dumps(filtered, indent=2, sort_keys=True) + '\n')
          PY
          python -m json.tool /tmp/evidence_state_blind.json > /dev/null
      - name: Audit Stage-1 reconstruction policy and action interface
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          priors = json.loads(Path('configs/formulation_priors.json').read_text())
          catalog = json.loads(Path('configs/action_catalog.json').read_text())
          policy = priors['decision_policy']

          assert policy['policy_id'] == 'MINIMUM_SUFFICIENT_INTERVENTION_V1'
          assert policy['evidence_region_policy']['acrylic_like']['broad_supported_region_pct_total'] == [15.0, 25.0]
          assert policy['evidence_region_policy']['minor_tackifier_like']['repeated_minor_resin_cluster_pct_total'] == [4.8, 6.4]
          assert 'performance_mitigation' in policy['experiment_intents']
          assert 'causal_isolation' in policy['experiment_intents']

          actions = {item['name']: item for item in catalog['actions']}
          q = actions['query_external_priors']['parameters']
          assert q['additionalProperties'] is False
          assert {'modifier_type', 'candidate_space_role', 'max_rows'} <= set(q['properties'])

          runtime_guidance = json.dumps(
              {'decision_policy': policy, 'query_external_priors': actions['query_external_priors']},
              sort_keys=True,
          )
          for token in ['14.004448', '4.118955', '1.47', '-0.16', '3.04', '1230', '1320']:
              assert token not in runtime_guidance, token

          with Path('data/external_evidence_hints.csv').open(newline='', encoding='utf-8') as fh:
              rows = {row['hint_id']: row for row in csv.DictReader(fh)}
          assert float(rows['H01']['resin_modifier_fraction_pct']) == 4.8
          assert float(rows['H02']['resin_modifier_fraction_pct']) == 5.3
          assert float(rows['H03']['resin_modifier_fraction_pct']) > 19.0
          assert float(rows['H08']['resin_modifier_fraction_pct']) == 15.0
          PY
      - name: Build V2 coarse candidate-space formalization
        run: python scripts/build_candidate_set.py --output /tmp/candidate_set_hypothesis_v2.json
      - name: Sanity-check coarse candidate-set JSON
        run: python -m json.tool /tmp/candidate_set_hypothesis_v2.json > /dev/null
      - name: Build outcome-blind fine-refinement space
        run: |
          python scripts/build_refinement_set.py --output /tmp/candidate_set_refinement_v1.json
          python -m json.tool /tmp/candidate_set_refinement_v1.json > /dev/null
      - name: Audit refinement anti-leakage and coordinate basis
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          ref = json.loads(Path('/tmp/candidate_set_refinement_v1.json').read_text())
          prov = ref['provenance']
          assert prov['coordinate_basis'] == 'normalized_total_wt_percent'
          assert prov['reads_formulations_csv'] is False
          assert prov['reads_follow_up_measurements'] is False
          assert prov['uses_validation_recipe_numeric_values_to_generate_domain'] is False
          assert prov['uses_validation_outcome_to_generate_domain'] is False

          text = Path('scripts/build_refinement_set.py').read_text()
          assert 'data/formulations.csv' not in text
          assert 'F1' not in text
          assert 'thermal_hold.csv' not in text

          rows = list(csv.DictReader(Path('data/formulations.csv').open()))
          f1 = next(r for r in rows if r['formulation_id'] == 'F1')
          parts = [float(f1[k]) for k in ['ppg2000','pdp70','ac1920','tk100','mdi']]
          total = sum(parts)
          ac = float(f1['ac1920']) / total * 100.0
          tk = float(f1['tk100']) / total * 100.0
          assert 13.9 < ac < 14.1
          assert 4.0 < tk < 4.2

          coords = [
              (float(c['formulation_state']['acrylic_like_modifier_pct']),
               float(c['formulation_state']['minor_tackifier_like_modifier_pct']))
              for c in ref['candidates']
          ]
          nearest = min(abs(a-ac) + abs(t-tk) for a,t in coords)
          assert nearest < 1.0, nearest
          PY
      - name: Build and audit naive headline baseline view
        run: |
          python scripts/build_naive_baseline_view.py \
            --candidate-set /tmp/candidate_set_hypothesis_v2.json \
            --output /tmp/naive_baseline_view.json
          python -m json.tool /tmp/naive_baseline_view.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          view = json.loads(Path('/tmp/naive_baseline_view.json').read_text())
          budget = view['information_budget']
          assert budget['raw_original_local_measurements_only'] is True
          assert budget['state_aware_theory_summary'] is False
          assert budget['external_database_or_literature'] is False
          assert budget['scientific_actions'] is False
          assert budget['candidate_space_rationale'] is False
          assert budget['planner_or_skeptic'] is False
          text = json.dumps(view, sort_keys=True)
          assert 'F1' not in text
          assert 'follow_up' not in text
          assert 'get_state_aware_rheology_summary' not in text
          assert 'external_evidence_hints' not in text
          PY
      - name: Smoke-test deterministic supplementary baseline and controller scorer
        run: |
          python scripts/run_deterministic_baseline.py \
            --candidate-set /tmp/candidate_set_hypothesis_v2.json \
            --output-dir /tmp/deterministic-baseline
          python scripts/summarize_agent_benchmark.py \
            --condition deterministic_evidence_ranker=/tmp/deterministic-baseline \
            --candidate-set /tmp/candidate_set_hypothesis_v2.json \
            --output-dir /tmp/benchmark-summary
          python -m json.tool /tmp/benchmark-summary/benchmark_summary.json > /dev/null
      - name: Reproduce local statistical analysis
        run: python scripts/statistical_analysis.py --output-dir /tmp/statistical-analysis
      - name: Sanity-check statistical summary
        run: python -m json.tool /tmp/statistical-analysis/analysis_summary.json > /dev/null
      - name: Reproduce statistical robustness checks
        run: python scripts/statistical_robustness.py --output-dir /tmp/statistical-robustness
      - name: Sanity-check robustness summary
        run: python -m json.tool /tmp/statistical-robustness/robustness_summary.json > /dev/null
      - name: Run provenance-aware chemistry audit
        run: python scripts/analysis_audit_v1.py --output-dir /tmp/analysis-audit-v1
      - name: Sanity-check provenance-aware audit
        run: python -m json.tool /tmp/analysis-audit-v1/audit_summary.json > /dev/null
      - name: Reproduce anchor-normalized master curve
        run: python scripts/master_curve_collapse.py --bootstrap 1000 --output-dir /tmp/master-curve-collapse
      - name: Sanity-check master-curve summary
        run: python -m json.tool /tmp/master-curve-collapse/master_curve_collapse_summary.json > /dev/null
      - name: Validate manuscript citation integrity
        run: python scripts/check_manuscript_citations.py

      - name: Validate Agent V4 configuration JSON
        run: |
          python -m json.tool configs/agent_v4.json > /dev/null
          python -m json.tool configs/hypothesis_registry.json > /dev/null
          python -m json.tool configs/measurement_catalog.json > /dev/null
          python -m json.tool schemas/agent_v4_experiment.schema.json > /dev/null
      - name: Compile Agent V4 runners
        run: |
          python -m py_compile scripts/run_agent_v4.py
          python -m py_compile scripts/adjudicate_agent_v4.py
          python -m py_compile scripts/compare_v3_v4.py
          python -m py_compile scripts/audit_stage1_blindness.py
      - name: Run the Stage-1 blindness audit
        run: |
          python scripts/build_stage1_blind_candidate_space.py --output /tmp/stage1_blind_space.json
          python scripts/audit_stage1_blindness.py --candidate-set /tmp/stage1_blind_space.json --label ci --output /tmp/blindness_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/blindness_audit.json').read_text())
          assert report['verdict'] == 'PASS', report
          assert report['n_critical'] == 0 and report['n_high'] == 0, report
          PY
      - name: Audit that the V4 VOI layer carries no held-out coordinate
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = ('14.004', '4.1189', '4.1190', '1230', '1320', '1281', '1228')
          sources = [
              'src/pur_new/voi.py',
              'configs/hypothesis_registry.json',
              'configs/measurement_catalog.json',
              'configs/agent_v4.json',
          ] + sorted(str(p) for p in Path('prompts').glob('agent_v4_*.txt'))
          for name in sources:
              text = Path(name).read_text(encoding='utf-8')
              for token in forbidden:
                  assert token not in text, (name, token)
          print('V4 VOI layer is free of held-out coordinates')
          PY
