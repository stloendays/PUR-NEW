name: export-submission-docx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-manuscript-docx.yml"
      - "manuscript/MAIN_TEXT_V5.md"
      - "manuscript/SUPPLEMENTARY_INFORMATION_V5.md"
      - "manuscript/references.bib"
      - "scripts/submission_cross_document_audit.py"
      - "skills/junbo-scientific-writing/scripts/audit_manuscript.py"
      - "analysis/figures_composite/**"
      - "analysis/figures/Supplementary_Figure_S1_PUR_chemistry.*"
      - "data/**"
      - "derived/**"
      - "analysis/results/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest python-docx

      - name: Run repository tests
        run: python -m pytest -q

      - name: Audit canonical manuscript and SI
        run: |
          python skills/junbo-scientific-writing/scripts/audit_manuscript.py             manuscript/MAIN_TEXT_V5.md --repo-root . --final
          python skills/junbo-scientific-writing/scripts/audit_manuscript.py             manuscript/SUPPLEMENTARY_INFORMATION_V5.md --repo-root . --final
          python scripts/submission_cross_document_audit.py

      - name: Install document rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc libreoffice-writer poppler-utils
          mkdir -p build/render_main build/render_si
          curl -L --fail --retry 3             https://raw.githubusercontent.com/citation-style-language/styles/master/royal-society-of-chemistry.csl             -o build/royal-society-of-chemistry.csl

      - name: Build Word reference style
        run: |
          python - <<'PY'
          from docx import Document
          from docx.enum.section import WD_SECTION
          from docx.enum.text import WD_LINE_SPACING
          from docx.shared import Inches, Pt, RGBColor
          from docx.oxml.ns import qn

          out = "build/reference.docx"
          doc = Document()
          sec = doc.sections[0]
          sec.page_width = Inches(8.5)
          sec.page_height = Inches(11)
          sec.top_margin = Inches(0.75)
          sec.bottom_margin = Inches(0.75)
          sec.left_margin = Inches(0.82)
          sec.right_margin = Inches(0.82)

          def set_font(style_name, size, bold=None, space_before=0, space_after=0):
              st = doc.styles[style_name]
              st.font.name = "Times New Roman"
              st._element.rPr.rFonts.set(qn("w:eastAsia"), "Times New Roman")
              st.font.size = Pt(size)
              st.font.color.rgb = RGBColor(0, 0, 0)
              if bold is not None:
                  st.font.bold = bold
              pf = st.paragraph_format
              pf.space_before = Pt(space_before)
              pf.space_after = Pt(space_after)
              pf.line_spacing = 1.08

          set_font("Normal", 11, False, 0, 5)
          set_font("Title", 16, True, 0, 10)
          set_font("Heading 1", 13, True, 10, 5)
          set_font("Heading 2", 11.5, True, 8, 4)
          set_font("Heading 3", 11, True, 7, 3)
          set_font("Caption", 10, False, 4, 7)

          # Pandoc commonly uses these styles if present.
          for name in ("Body Text", "First Paragraph"):
              if name in doc.styles:
                  set_font(name, 11, False, 0, 5)

          doc.add_paragraph("Reference")
          doc.save(out)
          PY

      - name: Prepare current manuscript sources for Word
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def prepare(src_path, out_path, title_override=None):
              src = Path(src_path).read_text(encoding="utf-8")
              # Use PNG in Word for maximum renderer compatibility while leaving
              # the canonical Markdown on vector SVG assets.
              src = re.sub(r"(analysis/[^)]+)\.svg\)", r"\1.png)", src)

              # Canonical Markdown keeps descriptive image alt text for readability,
              # but Pandoc interprets it as an implicit figure caption. The manuscript
              # already carries the full scientific caption as the following paragraph,
              # so blank the image alt only in the Word-export source to avoid duplicate captions.
              src = re.sub(r"!\[[^\]]*\]\(([^)]+)\)", r"![](\1)", src)

              lines = src.splitlines()
              if not lines:
                  raise SystemExit(f"Empty source: {src_path}")

              if title_override is None:
                  if not lines[0].startswith("# "):
                      raise SystemExit(f"Expected H1 title in {src_path}")
                  title = lines[0][2:].strip()
                  body_lines = lines[1:]
              else:
                  title = title_override
                  body_lines = lines[1:] if lines[0].startswith("# ") else lines

              # Horizontal rules are drafting separators, not submission content.
              body_lines = [line for line in body_lines if line.strip() != "---"]
              body = "\n".join(body_lines).lstrip()
              title_yaml = title.replace('"', '\\"')
              prepared = (
                  "---\n"
                  f'title: "{title_yaml}"\n'
                  'reference-section-title: "References"\n'
                  "---\n\n"
                  + body
                  + "\n"
              )
              Path(out_path).write_text(prepared, encoding="utf-8")

          prepare(
              "manuscript/MAIN_TEXT_V5.md",
              "build/PUR_MANUSCRIPT_FOR_WORD.md",
          )
          prepare(
              "manuscript/SUPPLEMENTARY_INFORMATION_V5.md",
              "build/PUR_SI_FOR_WORD.md",
              title_override="Supplementary Information",
          )
          PY

      - name: Convert canonical Markdown to DOCX
        run: |
          pandoc build/PUR_MANUSCRIPT_FOR_WORD.md             --from=markdown+tex_math_dollars             --to=docx             --citeproc             --bibliography=manuscript/references.bib             --csl=build/royal-society-of-chemistry.csl             --reference-doc=build/reference.docx             --resource-path=.:build:manuscript:analysis             -o build/PUR_Rheological_State_Experiment_Selection_Manuscript.docx

          pandoc build/PUR_SI_FOR_WORD.md             --from=markdown+tex_math_dollars             --to=docx             --citeproc             --bibliography=manuscript/references.bib             --csl=build/royal-society-of-chemistry.csl             --reference-doc=build/reference.docx             --resource-path=.:build:manuscript:analysis             -o build/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.docx

      - name: Normalize final Word typography
        run: |
          python - <<'PY'
          from copy import deepcopy
          import re

          from docx import Document
          from docx.enum.table import WD_CELL_VERTICAL_ALIGNMENT, WD_TABLE_ALIGNMENT
          from docx.enum.text import WD_ALIGN_PARAGRAPH
          from docx.shared import Pt, RGBColor
          from docx.oxml import OxmlElement
          from docx.oxml.ns import qn

          paths = [
              "build/PUR_Rheological_State_Experiment_Selection_Manuscript.docx",
              "build/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.docx",
          ]

          def set_run_font_xml(run_el):
              rpr = run_el.find(qn("w:rPr"))
              if rpr is None:
                  rpr = OxmlElement("w:rPr")
                  run_el.insert(0, rpr)
              rfonts = rpr.find(qn("w:rFonts"))
              if rfonts is None:
                  rfonts = OxmlElement("w:rFonts")
                  rpr.insert(0, rfonts)
              for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                  rfonts.set(qn(f"w:{attr}"), "Times New Roman")
              color = rpr.find(qn("w:color"))
              if color is None:
                  color = OxmlElement("w:color")
                  rpr.append(color)
              color.set(qn("w:val"), "000000")
              for attr in ("themeColor", "themeTint", "themeShade"):
                  key = qn(f"w:{attr}")
                  if key in color.attrib:
                      del color.attrib[key]

          def twips(emu):
              return int(emu / 635)

          def numeric_like(text):
              text = text.strip().replace("×", "").replace("%", "").replace("−", "-")
              return bool(re.fullmatch(r"[\s+\-0-9.,/=<>–—]+", text))

          def table_width_props(table):
              n = len(table.columns)
              header = [c.text.strip() for c in table.rows[0].cells]

              # Two main-text tables get deliberate widths.
              if n == 5 and header and header[0] == "Decision condition":
                  return [0.28, 0.09, 0.20, 0.22, 0.21]
              if n == 4 and header and header[0] == "Scientific decision":
                  return [0.18, 0.27, 0.25, 0.30]

              scores = []
              for j in range(n):
                  values = [row.cells[j].text.strip() for row in table.rows]
                  body = values[1:]
                  nonempty = [x for x in body if x]
                  numfrac = (
                      sum(numeric_like(x) for x in nonempty) / max(1, len(nonempty))
                  )
                  h = len(values[0])
                  mx = max([len(x) for x in body] or [0])
                  if numfrac >= 0.7:
                      score = max(7.0, min(13.0, 5.5 + 0.22 * h + 0.08 * mx))
                  else:
                      score = max(11.0, min(34.0, 7.0 + 0.35 * h + 0.42 * min(mx, 45)))
                  scores.append(score)

              props = [x / sum(scores) for x in scores]
              floor = 0.09 if n <= 6 else 0.07
              props = [max(floor, p) for p in props]
              total = sum(props)
              return [p / total for p in props]

          def set_cell_width(cell, width_emu):
              tcpr = cell._tc.get_or_add_tcPr()
              tcw = tcpr.find(qn("w:tcW"))
              if tcw is None:
                  tcw = OxmlElement("w:tcW")
                  tcpr.append(tcw)
              tcw.set(qn("w:type"), "dxa")
              tcw.set(qn("w:w"), str(twips(width_emu)))
              # python-docx also stores cell.width; LibreOffice relies on this
              # state when laying out fixed-width tables even when tcW is present.
              cell.width = width_emu

          def set_cell_margins(cell):
              tcpr = cell._tc.get_or_add_tcPr()
              mar = tcpr.find(qn("w:tcMar"))
              if mar is None:
                  mar = OxmlElement("w:tcMar")
                  tcpr.append(mar)
              for name, value in (("top", 45), ("start", 65), ("bottom", 45), ("end", 65)):
                  el = mar.find(qn(f"w:{name}"))
                  if el is None:
                      el = OxmlElement(f"w:{name}")
                      mar.append(el)
                  el.set(qn("w:w"), str(value))
                  el.set(qn("w:type"), "dxa")

          def set_table_borders(table):
              pr = table._tbl.tblPr
              old = pr.find(qn("w:tblBorders"))
              if old is not None:
                  pr.remove(old)
              borders = OxmlElement("w:tblBorders")
              pr.append(borders)
              for edge, size, colour in (
                  ("top", "8", "777777"),
                  ("bottom", "8", "777777"),
                  ("insideH", "3", "B5B5B5"),
              ):
                  el = OxmlElement(f"w:{edge}")
                  el.set(qn("w:val"), "single")
                  el.set(qn("w:sz"), size)
                  el.set(qn("w:color"), colour)
                  borders.append(el)
              for edge in ("left", "right", "insideV"):
                  el = OxmlElement(f"w:{edge}")
                  el.set(qn("w:val"), "nil")
                  borders.append(el)

          def rebuild_table(doc, old, usable_width):
              rows = len(old.rows)
              cols = len(old.columns)
              props = table_width_props(old)

              # Preserve the original cell content, including OMML math.
              saved = []
              for row in old.rows:
                  saved.append(
                      [
                          [
                              deepcopy(child)
                              for child in cell._tc
                              if child.tag != qn("w:tcPr")
                          ]
                          for cell in row.cells
                      ]
                  )

              new = doc.add_table(rows=rows, cols=cols)
              new.alignment = WD_TABLE_ALIGNMENT.CENTER
              new.autofit = False

              widths = [int(usable_width * p) for p in props]
              widths[-1] = usable_width - sum(widths[:-1])

              pr = new._tbl.tblPr
              layout = pr.find(qn("w:tblLayout"))
              if layout is None:
                  layout = OxmlElement("w:tblLayout")
                  pr.append(layout)
              layout.set(qn("w:type"), "fixed")
              tblw = pr.find(qn("w:tblW"))
              tblw.set(qn("w:type"), "dxa")
              tblw.set(qn("w:w"), str(twips(usable_width)))

              grid = new._tbl.tblGrid
              for child in list(grid):
                  grid.remove(child)
              for width in widths:
                  gc = OxmlElement("w:gridCol")
                  gc.set(qn("w:w"), str(twips(width)))
                  grid.append(gc)

              # Determine numeric/narrative body columns for alignment.
              numfrac = []
              for j in range(cols):
                  vals = [row.cells[j].text.strip() for row in old.rows[1:]]
                  nonempty = [x for x in vals if x]
                  numfrac.append(
                      sum(numeric_like(x) for x in nonempty) / max(1, len(nonempty))
                  )

              for ri, row in enumerate(new.rows):
                  if ri == 0:
                      trpr = row._tr.get_or_add_trPr()
                      hdr = OxmlElement("w:tblHeader")
                      hdr.set(qn("w:val"), "true")
                      trpr.append(hdr)

                  for ci, cell in enumerate(row.cells):
                      for child in list(cell._tc):
                          if child.tag != qn("w:tcPr"):
                              cell._tc.remove(child)
                      for child in saved[ri][ci]:
                          cell._tc.append(child)

                      set_cell_width(cell, widths[ci])
                      set_cell_margins(cell)
                      cell.vertical_alignment = WD_CELL_VERTICAL_ALIGNMENT.CENTER

                      for para in cell.paragraphs:
                          para.paragraph_format.space_before = Pt(0)
                          para.paragraph_format.space_after = Pt(0)
                          para.paragraph_format.line_spacing = 1.0
                          if ri == 0:
                              para.alignment = WD_ALIGN_PARAGRAPH.CENTER
                          elif ci == 0 or numfrac[ci] < 0.7:
                              para.alignment = WD_ALIGN_PARAGRAPH.LEFT
                          else:
                              para.alignment = WD_ALIGN_PARAGRAPH.CENTER
                          for run in para.runs:
                              run.font.size = Pt(8.5 if cols >= 6 else 9)
                              if ri == 0:
                                  run.bold = True

              set_table_borders(new)
              old._tbl.addprevious(new._tbl)
              old._tbl.getparent().remove(old._tbl)

          for path in paths:
              doc = Document(path)

              # Keep the Pandoc hierarchy/sizes, but force the manuscript house font.
              for style in doc.styles:
                  if hasattr(style, "font"):
                      style.font.name = "Times New Roman"
                      try:
                          rpr = style._element.get_or_add_rPr()
                          rfonts = rpr.find(qn("w:rFonts"))
                          if rfonts is None:
                              rfonts = OxmlElement("w:rFonts")
                              rpr.insert(0, rfonts)
                          for attr in ("ascii", "hAnsi", "eastAsia", "cs"):
                              rfonts.set(qn(f"w:{attr}"), "Times New Roman")
                      except Exception:
                          pass
                      style.font.color.rgb = RGBColor(0, 0, 0)

              # Force all ordinary/hyperlink runs to black Times New Roman.
              for run_el in doc.element.body.iter(qn("w:r")):
                  set_run_font_xml(run_el)

              # Remove decorative paragraph borders from direct formatting and styles.
              for p_el in doc.element.body.iter(qn("w:p")):
                  ppr = p_el.find(qn("w:pPr"))
                  if ppr is None:
                      continue
                  pbdr = ppr.find(qn("w:pBdr"))
                  if pbdr is not None:
                      ppr.remove(pbdr)

              for style in doc.styles:
                  ppr = getattr(style._element, "pPr", None)
                  if ppr is None:
                      continue
                  pbdr = ppr.find(qn("w:pBdr"))
                  if pbdr is not None:
                      ppr.remove(pbdr)

              # Rebuild Pandoc tables at a deterministic page width. This avoids
              # LibreOffice collapsing percentage-width Markdown tables into narrow columns.
              section = doc.sections[0]
              usable_width = int(
                  section.page_width - section.left_margin - section.right_margin
              )
              for table in list(doc.tables):
                  rebuild_table(doc, table, usable_width)

              # Keep each figure with its full scientific caption.
              for para in doc.paragraphs:
                  has_drawing = bool(para._p.xpath(".//w:drawing"))
                  if has_drawing:
                      para.paragraph_format.keep_with_next = True
                  txt = para.text.strip()
                  if txt.startswith("Figure ") or txt.startswith("Supplementary Figure "):
                      para.paragraph_format.keep_together = True
                  if txt.startswith("Table ") or txt.startswith("Supplementary Table "):
                      para.paragraph_format.keep_with_next = True

              doc.save(path)
          PY

      - name: Verify native Word equations and embedded figures
        run: |
          python - <<'PY'
          import re
          import zipfile

          files = [
              ("build/PUR_Rheological_State_Experiment_Selection_Manuscript.docx", 5, 10),
              ("build/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.docx", 2, 10),
          ]
          for p, min_images, min_math in files:
              with zipfile.ZipFile(p) as z:
                  xml = z.read("word/document.xml").decode("utf-8")
                  media = [n for n in z.namelist() if n.startswith("word/media/")]
              n_math = xml.count("<m:oMath")
              leftovers = re.findall(
                  r"\\(?:eta|ln|frac|mathbf|mathrm|approx|beta|mu|delta)",
                  xml,
              )
              print(p)
              print("  OMML equation elements:", n_math)
              print("  embedded media:", len(media))
              print("  literal LaTeX commands:", len(leftovers))
              if n_math < min_math:
                  raise SystemExit(f"Too few native equations in {p}")
              if len(media) < min_images:
                  raise SystemExit(f"Expected at least {min_images} embedded figures in {p}")
              if leftovers:
                  raise SystemExit(f"Literal LaTeX commands remain in {p}")
          PY

      - name: Render DOCX files for visual QA
        run: |
          mkdir -p build/lo_profile build/pdf
          libreoffice -env:UserInstallation=file://$PWD/build/lo_profile             --headless --convert-to pdf --outdir build/pdf             build/PUR_Rheological_State_Experiment_Selection_Manuscript.docx
          libreoffice -env:UserInstallation=file://$PWD/build/lo_profile             --headless --convert-to pdf --outdir build/pdf             build/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.docx

          pdftoppm -png -r 120             build/pdf/PUR_Rheological_State_Experiment_Selection_Manuscript.pdf             build/render_main/page
          pdftoppm -png -r 120             build/pdf/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.pdf             build/render_si/page

          test -n "$(ls build/render_main/page-*.png)"
          test -n "$(ls build/render_si/page-*.png)"

      - uses: actions/upload-artifact@v4
        with:
          name: PUR-submission-manuscript-package
          path: |
            build/PUR_Rheological_State_Experiment_Selection_Manuscript.docx
            build/PUR_Rheological_State_Experiment_Selection_Supplementary_Information.docx
            build/pdf/*.pdf
            build/render_main/page-*.png
            build/render_si/page-*.png
          if-no-files-found: error
          retention-days: 14
