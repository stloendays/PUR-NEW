<rect x="855" y="188" width="82" height="187" fill="#7A5C8E"/><rect x="1010" y="300" width="82" height="75" fill="#d7d7d7"/><rect x="1165" y="375" width="82" height="0" fill="#C46A3A"/>
<text x="896" y="177" text-anchor="middle" class="body bold">0.667</text><text x="1051" y="289" text-anchor="middle" class="body bold">0.267</text><text x="1206" y="355" text-anchor="middle" class="body bold">0.000</text>
<text x="896" y="405" text-anchor="middle" class="small">Full V4</text><text x="1051" y="405" text-anchor="middle" class="small">VOI withheld</text><text x="1206" y="405" text-anchor="middle" class="small">Order inverted</text>
<text x="896" y="335" text-anchor="middle" class="small">zero: 0/10</text><text x="1051" y="335" text-anchor="middle" class="small">zero: 3/5</text><text x="1206" y="335" text-anchor="middle" class="small">zero: 10/10</text>

