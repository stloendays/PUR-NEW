<line x1="220" y1="241" x2="220" y2="156" stroke="#777" stroke-width="3"/><line x1="209" y1="241" x2="231" y2="241" stroke="#777" stroke-width="3"/><line x1="209" y1="156" x2="231" y2="156" stroke="#777" stroke-width="3"/><circle cx="220" cy="173" r="9" fill="#7A5C8E" stroke="#222" stroke-width="1.5"/>
