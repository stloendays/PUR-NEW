name: Draw PUR chemistry schematic

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/draw_pur_chemistry_schematic.py"
      - ".github/workflows/draw-pur-chemistry-schematic.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install drawing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install rdkit cairosvg

      - name: Generate SVG and PNG
        run: python scripts/draw_pur_chemistry_schematic.py

      - name: Upload figure artifact
        uses: actions/upload-artifact@v4
        with:
          name: pur-chemistry-schematic
          path: |
            results/figures/pur_chemistry_schematic.svg
            results/figures/pur_chemistry_schematic.png
          if-no-files-found: error

      - name: Commit generated figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/figures/pur_chemistry_schematic.svg results/figures/pur_chemistry_schematic.png
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "figures: render PUR chemistry schematic"
            git push
          fi
