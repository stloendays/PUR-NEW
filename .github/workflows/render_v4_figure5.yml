name: Render V4 manuscript figures

on:
  push:
    branches: [main]
    paths:
      - "scripts/figure1_v4_workflow.R"
      - "scripts/figure4_v4_rule_ablation.R"
      - "scripts/figure5_rheological_coordinates.R"
      - "results/agent_v4_voi/rule_layer_ablation.json"
      - ".github/workflows/render_v4_figure5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::patchwork
            any::scales
            any::jsonlite

      - name: Render V4 Figure 1
        run: Rscript scripts/figure1_v4_workflow.R

      - name: Render V4 Figure 4
        run: Rscript scripts/figure4_v4_rule_ablation.R

      - name: Render V4 Figure 5
        run: Rscript scripts/figure5_rheological_coordinates.R

      - name: Commit rendered outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/figures/Figure4_v4_rule_ablation.pdf \
                  analysis/figures/Figure4_v4_rule_ablation.png \
                  analysis/figures/Figure4_v4_rule_ablation.svg                   analysis/figures/Figure5_rheological_coordinates.pdf                   analysis/figures/Figure5_rheological_coordinates.png                   analysis/figures/Figure5_rheological_coordinates.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "figures: render V4 manuscript Figures 1 and 5 [skip ci]"
          git push
