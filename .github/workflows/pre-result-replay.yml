name: pre-result-replay

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenAI-compatible model name
        required: true
        default: gpt-5.6-luna
      selection_mode:
        description: strict reproduces the frozen replay contract; audit lets the API choose among all admissible candidates
        required: true
        type: choice
        options:
          - strict
          - audit
        default: strict
      repeats:
        description: Independent API runs
        required: true
        default: "3"

jobs:
  replay:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Build pre-result evidence state
        run: |
          mkdir -p /tmp/pur-pre-result-replay
          python scripts/build_evidence_state.py --output /tmp/pur-pre-result-replay/evidence_state.json

      - name: Run contract-constrained pre-result replay
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 "${{ inputs.repeats }}"); do
            python scripts/run_pre_result_replay_agent.py \
              --selection-mode "${{ inputs.selection_mode }}" \
              --evidence-state /tmp/pur-pre-result-replay/evidence_state.json \
              --inspection-status no_results_inspected \
              --output-dir "/tmp/pur-pre-result-replay/run_${i}"
          done

      - name: Verify replay firewall and selected composition
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/pur-pre-result-replay')
          for manifest in root.glob('run_*/PUR_NEW_PRE_RESULT_REPLAY_R1__*/replay_manifest.json'):
              data = json.loads(manifest.read_text())
              assert data['evidence_profile'] == 'blind_pre_result'
              assert data['later_validation_outcome_available_to_agent'] is False
              if data['selection_mode'] == 'strict':
                  assert data['contract_selected_candidate_id'] == 'RPL_C04'
                  assert data['constrained_candidate_ids_passed_to_api'] == ['RPL_C04']
          PY

      - name: Upload replay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pre-result-replay-${{ github.run_id }}
          path: /tmp/pur-pre-result-replay
          if-no-files-found: error
