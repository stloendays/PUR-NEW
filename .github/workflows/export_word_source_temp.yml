name: temp-export-word-source

on:
  push:
    paths:
      - .github/workflows/export_word_source_temp.yml
  workflow_dispatch:

jobs:
  package-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: pur-word-source
          path: |
            manuscript/MAIN_TEXT_V5.md
            manuscript/references.bib
            analysis/figures_composite/fig1/Fig1.png
            analysis/figures_composite/fig2/Fig2.png
            analysis/figures_composite/fig3/Fig3.png
            analysis/figures_composite/fig4/Fig4.png
            analysis/figures_composite/fig5/Fig5.png
          if-no-files-found: error
          retention-days: 1
